[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-computational-biology-som-digits"
version = "1.0.0"
description = "Self-organizing map for clustering handwritten digits"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
    { name = "Kobie Hazon" },
    { name = "Daniel Ben Zion" },
]
dependencies = [
    "matplotlib==3.7.5",
    "numpy==1.24.4",
    "pyparsing==3.1.4",
    "scikit-learn==1.3.2",
    "scipy==1.15.3",
    "tqdm==4.66.6",
]

[project.scripts]
som-digits = "som_digits.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools]
packages = ["som_digits"]
package-dir = { som_digits = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: complete supplied-dataset regression"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["som_digits"]
